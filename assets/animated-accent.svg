<svg xmlns="http://www.w3.org/2000/svg" width="900" height="36" viewBox="0 0 900 36" role="img" aria-labelledby="title desc">
  <title id="title">From solid foundations to shipped products</title>
  <desc id="desc">A subtle crimson signal travels along an architectural line. Animation stops when reduced motion is requested.</desc>
  <style>
    .foundation { stroke: #d8d8d8; }
    .signal { animation: ship 12s linear infinite; }
    @keyframes ship { to { stroke-dashoffset: -1000; } }
    @media (prefers-color-scheme: dark) { .foundation { stroke: #373b42; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <defs>
    <path id="line" d="M12 24H300L312 12H588L600 24H888" />
  </defs>
  <use href="#line" class="foundation" fill="none" stroke-width="1" />
  <use href="#line" class="signal" fill="none" stroke="#c9363d" stroke-width="2" stroke-linecap="round" stroke-dasharray="72 928" stroke-dashoffset="0" />
  <g fill="#c9363d">
    <circle cx="12" cy="24" r="2.5" />
    <circle cx="450" cy="12" r="2.5" />
    <circle cx="888" cy="24" r="2.5" />
  </g>
</svg>
